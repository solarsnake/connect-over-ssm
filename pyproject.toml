[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "connect-over-ssm"
dynamic = ["version"]
description = "Connect to EC2 instances over AWS Systems Manager Session Manager"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["boto3"]

[project.optional-dependencies]
dev = ["pytest", "moto[ec2]>=5", "ruff"]

[project.scripts]
ssm-connect = "connect_over_ssm.cli:main"

[tool.hatch.version]
path = "src/connect_over_ssm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/connect_over_ssm"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
